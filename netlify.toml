# Netlify build: vite.config.ts swaps in Netlify's TanStack Start plugin when NETLIFY=true.
# Pages are written to dist/client; the server becomes a Netlify function automatically.
[build]
  command = "npx vite build && node scripts/check-models.mjs && node scripts/check-prerender-dist.mjs dist/client"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
